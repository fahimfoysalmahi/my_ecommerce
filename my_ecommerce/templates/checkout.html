<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>চেকআউট - পেমেন্ট করুন</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4;">

    <div style="background: white; padding: 30px; display: inline-block; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1);">
        <h2>Foysal Store - চেকআউট</h2>
        <hr>
        <p style="font-size: 18px;">আপনার অর্ডার করা প্রোডাক্ট: <strong>Scientific Calculator</strong></p>
        <p style="font-size: 20px; color: #e2136e;">মোট বিল: <strong>৳১২০০</strong></p>
        
        <form action="{% url 'checkout' %}" method="POST">
            {% csrf_token %}
            <button type="submit" style="background-color: #e2136e; color: white; padding: 12px 30px; border: none; font-size: 18px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                বিকাশ / নগদে লাইভ পে করুন
            </button>
        </form>
    </div>

</body>
</html>
