<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - Details</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .navbar { background-color: #1a1a1a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; font-size: 16px; font-weight: bold; }
        .logo { color: #2ecc71; font-size: 24px; font-weight: bold; }
        
        .container { max-width: 600px; background: white; margin: 40px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border: 1px solid #eee; }
        .img-box { width: 100%; max-height: 350px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .container img { max-width: 100%; max-height: 350px; object-fit: contain; border-radius: 8px; }
        
        h2 { color: #2c3e50; font-size: 24px; margin-top: 10px; }
        .price { color: #2ecc71; font-size: 24px; font-weight: bold; margin: 15px 0; }
        .desc-box { text-align: left; background: #fdfdfd; padding: 15px; border-radius: 8px; border-left: 4px solid #2ecc71; margin-bottom: 25px; }
        .desc-title { font-weight: bold; color: #333; margin-bottom: 5px; }
        .desc { color: #555; font-size: 15px; line-height: 1.6; }
        
        /* অর্ডার বাটন */
        .order-btn { display: block; background-color: #25d366; color: white; padding: 12px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2); transition: 0.3s; }
        .order-btn:hover { background-color: #20ba5a; }
        
        .back-btn { display: inline-block; color: #777; text-decoration: none; font-size: 14px; margin-top: 10px; }
        .back-btn:hover { color: #333; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">Foysal Store</div>
        <a href="{% url 'home' %}">← Back</a>
    </div>

    <div class="container">
        <div class="img-box">
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}">
            {% else %}
                <img src="https://via.placeholder.com/400" alt="No Image">
            {% endif %}
        </div>
        
        <h2>{{ product.name }}</h2>
        <p class="price">৳{{ product.price }}</p>
        
        <div class="desc-box">
            <div class="desc-title">প্রোডাক্ট ডেসক্রিপশন:</div>
            <p class="desc">{{ product.description }}</p>
        </div>
        
        <a href="https://wa.me/8801755280967?text=Hello,%20I%20want%20to%20order%20{{ product.name }}" target="_blank" class="order-btn">💬 Order via WhatsApp</a>
        
        <a href="{% url 'home' %}" class="back-btn">হোমপেজে ফিরে যাও</a>
    </div>

</body>
</html>
